services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zawed
      POSTGRES_PASSWORD: zawed
      POSTGRES_DB: zawed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zawed"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://zawed:zawed@db:5432/zawed?schema=public
      AUTH_SECRET: zawed-change-this-secret-in-production
      DEFAULT_TAX_RATE: "0.05"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             npx tsx prisma/seed.ts &&
             npm run start"

volumes:
  pgdata:
